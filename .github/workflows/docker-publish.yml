name: Build and Push Docker Image

on:
  # Auto-build :latest on every push to main
  push:
    branches:
      - main
  # Manual trigger for tagged releases (e.g. 0.3.1)
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g. 0.3.1)'
        required: true
        default: '0.3.1'

jobs:
  build-and-push:
    if: github.repository == 'Nezreka/MetaSync'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ env.OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./node
          file: ./node/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          tags: |
            boulderbadgedad/metasync:latest
            ghcr.io/${{ env.OWNER }}/metasync:latest
            ${{ inputs.version_tag && format('boulderbadgedad/metasync:{0}', inputs.version_tag) || '' }}
            ${{ inputs.version_tag && format('ghcr.io/{0}/metasync:{1}', env.OWNER, inputs.version_tag) || '' }}

      # Same step as SoulSync's publish workflow. It only runs for a numbered
      # release, and does nothing until the DISCORD_ANNOUNCEMENTS_WEBHOOK
      # repository secret is set.
      - name: Announce release to Discord
        if: success() && inputs.version_tag
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_ANNOUNCEMENTS_WEBHOOK }}
          VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then echo "No webhook configured, skipping"; exit 0; fi
          curl -s -H "Content-Type: application/json" \
            -d "{\"embeds\": [{\"title\": \"MetaSync v$VERSION_TAG Released\", \"description\": \"A new version of MetaSync is available! Pull the latest Docker image to update.\n\n\`\`\`\ndocker pull boulderbadgedad/metasync:$VERSION_TAG\n\`\`\`\", \"color\": 5025616, \"footer\": {\"text\": \"MetaSync Auto-Release\"}, \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}" \
            "$DISCORD_WEBHOOK"
