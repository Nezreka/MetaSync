name: Build and Push Docker Image

on:
  # Auto-build :latest on every push to main
  push:
    branches:
      - main
  # Manual trigger for tagged releases (e.g. 0.2.0)
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g. 0.2.0)'
        required: true
        default: '0.2.0'

jobs:
  build-and-push:
    if: github.repository == 'Nezreka/MetaSync'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ env.OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./node
          file: ./node/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            boulderbadgedad/metasync:latest
            ghcr.io/${{ env.OWNER }}/metasync:latest
            ${{ inputs.version_tag && format('boulderbadgedad/metasync:{0}', inputs.version_tag) || '' }}
            ${{ inputs.version_tag && format('ghcr.io/{0}/metasync:{1}', env.OWNER, inputs.version_tag) || '' }}
