name: Dev Nightly Build

# The node image built from dev, the way SoulSync builds its own: on every
# push to dev, and nightly when dev moved in the last day. GHCR only; Docker
# Hub carries releases (docker-publish.yml).
#
#   ghcr.io/<owner>/metasync:dev                    the newest dev build
#   ghcr.io/<owner>/metasync:dev-<date>-<sha>       that exact build
#   ghcr.io/<owner>/metasync:nightly                the last scheduled build

on:
  # Nightly at 4:00 AM UTC, only if dev has new commits
  schedule:
    - cron: '0 4 * * *'
  # Also build on every push to dev for immediate feedback
  push:
    branches:
      - dev
  # Manual trigger for testing
  workflow_dispatch:

concurrency:
  group: dev-nightly
  cancel-in-progress: true

jobs:
  nightly:
    if: github.repository == 'Nezreka/MetaSync'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v6
        with:
          ref: dev

      - name: Set lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Check for recent commits (scheduled only)
        if: github.event_name == 'schedule'
        id: recent
        run: |
          LAST_COMMIT=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DIFF=$(( NOW - LAST_COMMIT ))
          if [ "$DIFF" -gt 86400 ]; then
            echo "No commits in the last 24h, skipping build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.recent.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: node/requirements.txt

      # An image is only published from a dev that passes the node's tests.
      - name: Install dependencies and run the node tests
        if: steps.recent.outputs.skip != 'true'
        working-directory: node
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m compileall -q metasync_node run.py
          python -m pytest tests

      - name: Set up QEMU
        if: steps.recent.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.recent.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.recent.outputs.skip != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ env.OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate build tag
        if: steps.recent.outputs.skip != 'true'
        id: tag
        run: |
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push to GHCR
        if: steps.recent.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./node
          file: ./node/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            COMMIT_SHA=${{ steps.tag.outputs.sha }}
          tags: |
            ghcr.io/${{ env.OWNER }}/metasync:dev
            ghcr.io/${{ env.OWNER }}/metasync:dev-${{ steps.tag.outputs.date }}-${{ steps.tag.outputs.short_sha }}
            ${{ github.event_name == 'schedule' && format('ghcr.io/{0}/metasync:nightly', env.OWNER) || '' }}
